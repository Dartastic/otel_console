name: otel_console
description: >-
  OpenTelemetry instrumentation for console output by Dartastic.io. Captures
  print, stdout and stderr as OpenTelemetry log records, without looping.
version: 0.1.0-wip
repository: https://github.com/dartastic/otel_console
homepage: https://dartastic.io

environment:
  sdk: ^3.4.0

dependencies:
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
